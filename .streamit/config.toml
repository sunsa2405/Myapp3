[server]
runOnSave = true

[browser]
gatherUsageStats = false

# 차분한 연구소/산업용 톤: 파란 계열 primary 하나, 회색조 배경.
# [theme.light]와 [theme.dark]를 둘 다 정의하면 사용자가 설정 메뉴에서 라이트/다크를 고를 수 있고,
# 기본값은 운영체제 설정을 따른다.
[theme]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
headingFontWeights = [700, 600, 600, 600, 600, 600]
showSidebarBorder = true

[theme.light]
primaryColor = "#256abf"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f6"
textColor = "#1f2328"
borderColor = "#e1e0d9"
dataframeHeaderBackgroundColor = "#f3f4f6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#eceef2"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1b1f27"
textColor = "#f0efec"
borderColor = "#2c2f36"
dataframeHeaderBackgroundColor = "#1b1f27"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#13161c"
secondaryBackgroundColor = "#1b1f27"
